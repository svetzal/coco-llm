# Settings for the table signage image. Shell syntax: the image builder
# sources this file inside its container. No secrets belong here except
# the Wi-Fi key, which is optional; leave it blank and the Pi stays
# offline, which is all the slideshow needs.

# The stock Raspberry Pi OS Lite (64-bit) release the image starts from.
# Pinned by date and checksum so a rebuild months later is the same image.
# The current release is always at
#   https://downloads.raspberrypi.com/raspios_lite_arm64_latest
# Update both lines together; the builder refuses a checksum mismatch.
BASE_IMAGE_URL=https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz
BASE_IMAGE_SHA256=acff736ca7945e3b305f07cda4abdb870910e12634991da69783611756e381b3

# Room added to the root partition for the packages and the slides. The
# Pi grows the partition to fill the card on its first boot regardless.
GROW_MB=512

# The machine.
SIGNAGE_HOSTNAME=coco-signage
SIGNAGE_USER=coco
SIGNAGE_PASSWORD=cocollm
TIMEZONE=America/Toronto

# Remote access, for swapping slides without rewriting the card. Ethernet
# works with no further setup. Wi-Fi joins only if SSID and PSK are set.
ENABLE_SSH=yes
WIFI_COUNTRY=CA
WIFI_SSID=
WIFI_PSK=

# The loop. Seconds per slide, and the fade between slides in
# milliseconds (0 for a hard cut).
SLIDE_SECONDS=12
BLEND_MS=400

# Leave blank to let fbi find the display. If the screen stays black on
# the Pi, set /dev/fb0 here, rebuild, and it draws to the framebuffer
# instead of talking to the display driver directly.
FBI_DEVICE=
