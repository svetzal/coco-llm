[project]
name = "coco-llm"
version = "0.1.0"
description = "Support tooling for a tiny language model that trains on a 6809-based Color Computer"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
    "music21>=10.5.0",
    "pygame-ce>=2.5.7",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src/reference"]
testpaths = ["tests"]
