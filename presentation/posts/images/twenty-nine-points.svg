<text x="768.0" y="946.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1D4A13" text-anchor="middle" letter-spacing="1.5">NOTHING IN THE NUMBERS SAYS WHAT A MAKER IS. THE MAKERS ARE NEAR EACH OTHER BECAUSE THE SAME KIND OF TOKEN FOLLOWS THEM.</text>
<text x="768.0" y="974.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1D4A13" text-anchor="middle" letter-spacing="1.5">THE SMALLER POINTS ARE THE MODEL NAMES; THE CROWDED ONES ARE LEFT UNLABELLED.</text>
